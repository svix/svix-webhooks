name: Server CI

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    working-directory: server

jobs:
  check-fmt:
    name: Check formatting
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          components: rustfmt

      - name: rustfmt
        run: cargo fmt -- --check

  check-unused-deps:
    name: Check for unused dependencies
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-machete

      - run: cargo machete

  cargo-sort:
    name: 'Run cargo-sort'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - name: Install cargo sort
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-sort@2.1.3

      - name: Run cargo sort
        run: cargo sort --workspace --check --check-format

  test-versions:
    name: Server CI
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        # keep this in sync with server/Cargo.toml
        rust: ["1.95.0", stable, beta]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "server -> target"
          # only save the cache on the main branch
          # cf https://github.com/Swatinem/rust-cache/issues/95
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # include relevant information in the cache name
          prefix-key: "server-${{ matrix.rust }}"

      - name: Install nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest

      - name: Update lockfile
        # If it's the MSRV job, rather than stable or beta
        if: ${{ startsWith(matrix.rust, '1.') }}
        run: cargo update
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

      - name: Build
        run: cargo test --all-features --no-run --locked

      - name: Install dependencies
        run: sudo apt-get install -y jq

      - name: Check for uncommitted OpenAPI changes
        run: ./generate-openapi.sh --check

      - name: Start dependencies
        run: docker compose -f "testing-docker-compose.yml" up -d

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run migrations
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          SVIX_REDIS_DSN: "redis://localhost:6379"
          SVIX_QUEUE_TYPE: "redis"
          SVIX_JWT_SECRET: "test value"
          SVIX_CACHE_TYPE: "memory"
        run: cargo run -- --wait-for 15 migrate

      - name: Run tests
        run: ./run-tests.sh

      - name: Stop dependencies
        run: docker compose -f "testing-docker-compose.yml" down
