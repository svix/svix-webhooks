name: JavaScript Release

on:
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: release
    defaults:
      run:
        working-directory: javascript

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          registry-url: 'https://registry.npmjs.org'

      - name: Install modules and update NPM
        run: |
          npm install -g npm@latest
          npm install

      - name: Publish
        run: |
          version="$(node -p 'require("./package.json").version')"
          # A semver prerelease (anything with a `-`) must not become the default
          # `npm install svix`; publish it under the `next` dist-tag instead.
          if [[ "$version" == *-* ]]; then
            tag=next
          else
            tag=latest
          fi
          echo "Publishing svix@$version with dist-tag '$tag'"
          npm publish --tag "$tag"
