name: Bridge CI

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    working-directory: bridge

jobs:
  check-fmt:
    name: Check formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: nightly
          components: rustfmt

      - name: rustfmt
        run: cargo fmt -- --check

  cargo-sort:
    name: 'Run cargo-sort'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - name: Install cargo sort
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-sort

      - name: Run cargo sort
        run: cargo sort --workspace --check --check-format

  check-unused-deps:
    name: Check for unused dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-machete

      - run: cargo machete

  test-versions:
    name: Webhook Bridge CI
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        rust: ["1.95", stable, beta]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "bridge -> target"
          # only save the cache on the main branch
          # cf https://github.com/Swatinem/rust-cache/issues/95
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # include relevant information in the cache name
          prefix-key: "bridge-${{ matrix.rust }}"

      - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: nextest

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Install system dependencies
        # Packages should align with whatever is in the bridge/Dockerfile
        run: |
          sudo apt-get install -y \
            build-essential=12.* \
            checkinstall=1.* \
            curl \
            libssl-dev=* \
            pkg-config=1.8.* \
            zlib1g-dev=1:*

      - name: Build (no features)
        run: cargo check --no-default-features

      - name: Build (all features)
        run: cargo check --all-features

      - name: Build (default features)
        run: cargo check

      - name: Start required services
        run: docker compose -f "testing-docker-compose.yml" up -d

      - name: Run tests
        run: ./run-tests.sh

      - name: Stop required services
        run: docker compose -f "testing-docker-compose.yml" down

      - name: Idle Test
        run: ./run-idle-test.sh
