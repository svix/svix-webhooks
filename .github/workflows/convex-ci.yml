name: Convex CI

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "latest"

      - name: Install modules
        run: |
          cd convex
          npm ci

      - name: Lint
        run: |
          cd convex
          npm run lint

      - name: Test
        run: |
          cd convex
          npm test
