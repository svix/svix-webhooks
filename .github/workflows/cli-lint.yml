name: CLI Lint

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: svix-cli

jobs:
  check-fmt:
    name: Check formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt

      - name: rustfmt
        run: cargo fmt -- --check

  cargo-sort:
    name: 'Run cargo-sort'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        name: Checkout

      - name: Install cargo sort
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-sort@2.1.3

      - name: Run cargo sort
        run: cargo sort --workspace --check --check-format

  hadolint:
    name: Run Hadolint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: svix-cli/Dockerfile

  test-versions:
    name: CLI Lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # keep this in sync with svix-cli/Cargo.toml MSRV
        rust: ["1.90.0", stable, beta]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: "svix-cli -> target"
          # only save the cache on the main branch
          # cf https://github.com/Swatinem/rust-cache/issues/95
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # include relevant information in the cache name
          prefix-key: "cli-${{ matrix.rust }}"

      - uses: taiki-e/install-action@v2.88.0
        with:
          tool: nextest

      - name: Update lockfile
        # If it's the MSRV job, rather than stable or beta
        if: ${{ startsWith(matrix.rust, '1.') }}
        run: cargo update
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo nextest run
