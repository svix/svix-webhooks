name: Java Release

on:
  workflow_dispatch:
  workflow_call:

jobs:
  dotnet:
    name: Java Release
    runs-on: ubuntu-24.04
    environment: release

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '25'
          server-id: central
          server-username-env-var: NEXUS_USERNAME
          server-password-env-var: NEXUS_PASSWORD

      - name: Install GPG Signing Key
        run: |
          echo -e "$OSSRH_GPG_SECRET_KEY" | gpg --batch --import
        env:
          OSSRH_GPG_SECRET_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}

      - name: Publish
        run: |
          cd java
          mvn -B -P release deploy -Dgpg.keyname="$OSSRH_GPG_KEY_NAME"
        env:
          NEXUS_USERNAME: "${{secrets.NEXUS_USERNAME}}"
          NEXUS_PASSWORD: "${{secrets.NEXUS_PASSWORD}}"
          OSSRH_GPG_KEY_NAME: "${{secrets.OSSRH_GPG_KEY_NAME}}"
          MAVEN_GPG_PASSPHRASE: "${{secrets.OSSRH_GPG_SECRET_KEY_PASSWORD}}"
