name: CLI Security

on:
  push:
    branches:
      - main
    paths:
      - 'svix-cli/**/Cargo.toml'
      - 'svix-cli/**/Cargo.lock'
      - 'rust/**/Cargo.toml'
      - 'rust/**/Cargo.lock'
      - '.github/workflows/cli-security.yml'
  pull_request:
    paths:
      - 'svix-cli/**/Cargo.toml'
      - 'svix-cli/**/Cargo.lock'
      - 'rust/**/Cargo.toml'
      - 'rust/**/Cargo.lock'
      - '.github/workflows/cli-security.yml'

jobs:
  security_audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: svix-cli/Cargo.toml
