name: Java Lint
on:
  workflow_call:

jobs:
  dotnet:
    name: Java Lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        java-version: ["8", "11", "25"]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Build
        run: |
          cd java
          mvn -B verify

      - name: Release profile dry run
        if: matrix.java-version == '25'
        run: |
          cd java
          mvn -B -P release verify -Dgpg.skip
