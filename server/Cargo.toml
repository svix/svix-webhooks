[workspace]
members = ["generate-openapi", "svix-server", "svix-server-derive"]
default-members = ["svix-server"]
resolver = "2"

[workspace.dependencies]
aide = { version = "0.14.2", features = ["axum", "axum-json", "axum-query", "redoc", "macros"] }
anyhow = "1.0.56"
# pinned to ensure the [patch] below is used
hyper = { version = "=1.11.1", features = ["full"] }
serde = { version = "1.0.184", features = ["derive"] }
serde_json = { version = "1.0.74", features = ["arbitrary_precision", "raw_value"] }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
inefficient_to_string = "warn"
macro_use_imports = "warn"
mut_mut = "warn"
nonstandard_macro_braces = "warn"
todo = "warn"
uninlined_format_args = "warn"

[workspace.package]
edition = "2021"
license = "MIT"
version = "1.104.0"
# keep this in sync with .github/workflows/server-ci.yml
rust-version = "1.95"

[profile.dev]
# optimize host dependencies for faster rebuilds.
# slows down compilation of those dependencies, but they'll not be compiled
# nearly as often as workspace crates in local development.
build-override.opt-level = 2

[profile.dev.package]
# not worth optimizing, much more likely to change than other host deps
# and not cached in CI.
svix-server-derive = { opt-level = 0 }

[patch.crates-io]
hyper = { git = "https://github.com/svix/hyper.git", rev = "3874b0d849c3fad5abf01e73d2ed9120ae002863" }
