[graph]
targets = [
    { triple = "x86_64-pc-windows-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
# there are multiple projects in here
unused-ignored-advisory = "allow"
ignore = [
    # TODO: Update dependencies that use rsa crate
    "RUSTSEC-2023-0071",
    # TODO(15080): replace syntect
    "RUSTSEC-2025-0141",
    # TODO: get rid of proc-macro2 (in favor of proc-macro3, I guess)
    "RUSTSEC-2026-0173",
    # TODO(15015): move from chrono to jiff
    "RUSTSEC-2026-0543",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0", # MIT No Attribution
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
]
unused-allowed-license = "allow"
unused-license-exception = "allow"
confidence-threshold = 0.8
exceptions = [
    { allow = ["EPL-2.0"], name = "colored_json", version = "*" }
]

# TODO: Include internal crates
[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
allow = []
deny = [
    # Versions containing the binary blob
    # See: https://github.com/serde-rs/serde/issues/2538
    { name = "serde_derive", version = ">1.0.171, <1.0.184"},
    { name = "axum", version = "<0.7" },
    { name = "bincode" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/svix/hyper.git",
    "https://github.com/svix/omniqueue-rs.git",
    "https://github.com/svix/rust-executable-metadata.git",
    # TODO: remove this after upgrade to seaorm 2 / sqlx 0.9
    "https://github.com/svix/sqlx.git",
]
# there are several projects in here, so it's okay if we don't use them all
unused-allowed-source = "allow"
